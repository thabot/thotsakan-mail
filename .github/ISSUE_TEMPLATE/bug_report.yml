name: 🐛 Bug Report
description: File a bug report to help us improve Thotsakan Mail Engine
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the form below.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Start engine with `bun run src/index.ts`
        2. Call POST /v1/emails/send with payload...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Environment & Version
      description: Bun version, Docker image tag, and Operating System.
      placeholder: Bun 1.4.2 / Docker Alpine / Ubuntu 22.04
    validations:
      required: true
