<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#090d16" stop-opacity="1"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>

    <!-- Thotsakan Emerald Skin Gradient -->
    <linearGradient id="emeraldSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="40%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Golden Crown Gradient -->
    <linearGradient id="thaiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Mail Beam & Lightning Gradient -->
    <linearGradient id="cyanEnergy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Ruby Gem Gradient -->
    <linearGradient id="rubyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="60%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="neonPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" rx="160" fill="url(#bgGlow)"/>

  <!-- Outer Protective Halo Circle (Representing 10 Providers Ring) -->
  <circle cx="400" cy="400" r="330" fill="none" stroke="url(#thaiGold)" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 8"/>
  <circle cx="400" cy="400" r="345" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- ==================== 10 MINI HEADS (Top Crown Tier: 1 Face, Middle Tier: 3 Faces, Lower Tier: 3 Faces, Base: 3 Faces = 10 Heads) ==================== -->
  <g id="crownTiers" filter="url(#goldGlow)">
    <!-- Topmost Pinnacle Spire (Chadaphon) -->
    <path d="M400 110 L407 165 L393 165 Z" fill="url(#thaiGold)"/>
    <circle cx="400" cy="105" r="5" fill="#fef08a"/>
    <circle cx="400" cy="105" r="2" fill="#ffffff"/>
    <path d="M390 165 L410 165 L415 185 L385 185 Z" fill="url(#thaiGold)"/>

    <!-- Tier 3: Top Divine Face (The Supreme Crown Face) -->
    <circle cx="400" cy="205" r="14" fill="url(#emeraldSkin)" stroke="url(#thaiGold)" stroke-width="2"/>
    <path d="M394 203 Q400 200 406 203" stroke="#fef08a" stroke-width="1.5" fill="none"/>
    <circle cx="400" cy="195" r="4" fill="url(#rubyGlow)"/>

    <!-- Tier 2: 3 Celestial Demon Faces -->
    <!-- Left Face -->
    <circle cx="360" cy="235" r="16" fill="url(#emeraldSkin)" stroke="url(#thaiGold)" stroke-width="2"/>
    <path d="M353 234 Q360 231 367 234" stroke="#fef08a" stroke-width="1.5" fill="none"/>

    <!-- Center Face -->
    <circle cx="400" cy="240" r="18" fill="url(#emeraldSkin)" stroke="url(#thaiGold)" stroke-width="2"/>
    <path d="M392 238 Q400 234 408 238" stroke="#fef08a" stroke-width="1.5" fill="none"/>
    <polygon points="400,224 404,230 396,230" fill="#fef08a"/>

    <!-- Right Face -->
    <circle cx="440" cy="235" r="16" fill="url(#emeraldSkin)" stroke="url(#thaiGold)" stroke-width="2"/>
    <path d="M433 234 Q440 231 447 234" stroke="#fef08a" stroke-width="1.5" fill="none"/>

    <!-- Tier 1: 3 Lower Flanking Demon Faces -->
    <!-- Far Left -->
    <circle cx="320" cy="275" r="19" fill="url(#emeraldSkin)" stroke="url(#thaiGold)" stroke-width="2.5"/>
    <path d="M312 274 Q320 270 328 274" stroke="#fef08a" stroke-width="2" fill="none"/>
    
    <!-- Mid Center -->
    <circle cx="400" cy="285" r="22" fill="url(#emeraldSkin)" stroke="url(#thaiGold)" stroke-width="2.5"/>
    <path d="M390 283 Q400 278 410 283" stroke="#fef08a" stroke-width="2" fill="none"/>
    <circle cx="400" cy="274" r="4" fill="url(#rubyGlow)"/>

    <!-- Far Right -->
    <circle cx="480" cy="275" r="19" fill="url(#emeraldSkin)" stroke="url(#thaiGold)" stroke-width="2.5"/>
    <path d="M472 274 Q480 270 488 274" stroke="#fef08a" stroke-width="2" fill="none"/>
  </g>

  <!-- Crown Base Band (Monga-Kuta Gold Crown Structure) -->
  <path d="M300 320 Q400 290 500 320 L520 350 Q400 325 280 350 Z" fill="url(#thaiGold)" stroke="#b45309" stroke-width="2"/>
  <!-- Ruby gems on crown band -->
  <circle cx="400" cy="318" r="7" fill="url(#rubyGlow)"/>
  <circle cx="350" cy="324" r="5" fill="url(#rubyGlow)"/>
  <circle cx="450" cy="324" r="5" fill="url(#rubyGlow)"/>
  <circle cx="310" cy="336" r="4" fill="#38bdf8"/>
  <circle cx="490" cy="336" r="4" fill="#38bdf8"/>

  <!-- ==================== MAIN THOTSAKAN FACE (THE PRIMARY TITAN HEAD) ==================== -->
  <g id="mainHead">
    <!-- Golden Ear Ornaments (Kranok Wings) -->
    <!-- Left Ear Kranok -->
    <path d="M285 360 C230 330 205 380 185 410 C215 425 245 405 275 420 C280 395 282 375 285 360 Z" fill="url(#thaiGold)" stroke="#b45309" stroke-width="2"/>
    <path d="M210 390 Q240 375 260 405" stroke="#fef08a" stroke-width="2" fill="none"/>

    <!-- Right Ear Kranok -->
    <path d="M515 360 C570 330 595 380 615 410 C585 425 555 405 525 420 C520 395 518 375 515 360 Z" fill="url(#thaiGold)" stroke="#b45309" stroke-width="2"/>
    <path d="M590 390 Q560 375 540 405" stroke="#fef08a" stroke-width="2" fill="none"/>

    <!-- Emerald Face Mask -->
    <path d="M280 350 Q400 325 520 350 C545 420 535 500 480 545 C440 575 360 575 320 545 C265 500 255 420 280 350 Z" 
          fill="url(#emeraldSkin)" stroke="url(#thaiGold)" stroke-width="4"/>

    <!-- Facial Contours & War Paint Details -->
    <path d="M315 385 Q350 400 370 385" stroke="#047857" stroke-width="3" fill="none"/>
    <path d="M485 385 Q450 400 430 385" stroke="#047857" stroke-width="3" fill="none"/>

    <!-- Fierce Eyes (Demon Glare) -->
    <!-- Left Eye Socket & Eyebrow -->
    <path d="M310 405 Q350 385 375 415 Q340 425 310 405 Z" fill="#022c22" stroke="url(#thaiGold)" stroke-width="2"/>
    <path d="M305 395 Q350 370 380 405" stroke="url(#thaiGold)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="346" cy="410" rx="9" ry="6" fill="#f59e0b"/>
    <circle cx="347" cy="410" r="3.5" fill="#0f172a"/>
    <circle cx="349" cy="408" r="1.5" fill="#ffffff"/>

    <!-- Right Eye Socket & Eyebrow -->
    <path d="M490 405 Q450 385 425 415 Q460 425 490 405 Z" fill="#022c22" stroke="url(#thaiGold)" stroke-width="2"/>
    <path d="M495 395 Q450 370 420 405" stroke="url(#thaiGold)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="454" cy="410" rx="9" ry="6" fill="#f59e0b"/>
    <circle cx="453" cy="410" r="3.5" fill="#0f172a"/>
    <circle cx="451" cy="408" r="1.5" fill="#ffffff"/>

    <!-- Third Eye / Forehead Urna (Gem of Omniscience) -->
    <polygon points="400,355 407,370 400,385 393,370" fill="url(#rubyGlow)" stroke="#fef08a" stroke-width="1.5"/>

    <!-- Golden Snarl Fangs & Majestic Mouth -->
    <!-- Upper Lip Band -->
    <path d="M345 470 Q400 455 455 470 Q400 480 345 470 Z" fill="#064e3b" stroke="url(#thaiGold)" stroke-width="2"/>
    
    <!-- Demon Tusks Curved Upward -->
    <!-- Left Tusk -->
    <path d="M335 482 Q325 440 345 428 Q345 460 355 476 Z" fill="#fffbeb" stroke="url(#thaiGold)" stroke-width="2"/>
    <!-- Right Tusk -->
    <path d="M465 482 Q475 440 455 428 Q455 460 445 476 Z" fill="#fffbeb" stroke="url(#thaiGold)" stroke-width="2"/>
    
    <!-- Golden Beard / Chin Ornament -->
    <path d="M370 540 Q400 580 430 540 Q400 555 370 540 Z" fill="url(#thaiGold)" stroke="#b45309" stroke-width="2"/>
  </g>

  <!-- ==================== THE TRANSACTIONAL EMAIL DISPATCHER WINGS & ENVELOPE ==================== -->
  <g id="mailDeliveryMatrix" filter="url(#neonPulse)">
    <!-- Dynamic Electronic Mail Packet (Centrally Erupting from Titan's Chest) -->
    <g transform="translate(400, 565)">
      <!-- Envelope Background Body -->
      <path d="M-150 0 L150 0 L180 120 L-180 120 Z" fill="#0f172a" stroke="url(#cyanEnergy)" stroke-width="4"/>
      
      <!-- Envelope Lower Triangles -->
      <path d="M-180 120 L0 30 L180 120" fill="none" stroke="url(#cyanEnergy)" stroke-width="3"/>
      
      <!-- Golden Envelope Flap (Unsealed, Sending Speed Stream) -->
      <path d="M-150 0 L0 75 L150 0" fill="none" stroke="url(#thaiGold)" stroke-width="4" stroke-linecap="round"/>

      <!-- Central Fast-Dispatch Lightning / Fiber Laser -->
      <path d="M-15 -35 L10 5 L-5 15 L20 60 L-10 20 L5 10 Z" fill="#fef08a" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="0" cy="18" r="8" fill="url(#rubyGlow)"/>
    </g>

    <!-- Outgoing Dispatch Rays (Left & Right Wings) -->
    <!-- Left Swift Wings -->
    <path d="M220 575 L90 530 L150 600 L80 620 L180 645" fill="none" stroke="url(#cyanEnergy)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Swift Wings -->
    <path d="M580 575 L710 530 L650 600 L720 620 L620 645" fill="none" stroke="url(#cyanEnergy)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ==================== TYPOGRAPHY BRANDING ==================== -->
  <!-- "THOTSAKAN" Primary Wordmark -->
  <text x="400" y="725" text-anchor="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="34" font-weight="900" letter-spacing="9" 
        fill="#ffffff">
    THOTSAKAN
  </text>

  <!-- "MAIL ENGINE" Microservice Subtitle -->
  <text x="400" y="755" text-anchor="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14" font-weight="700" letter-spacing="6" 
        fill="#38bdf8">
    MAIL ENGINE
  </text>
</svg>
