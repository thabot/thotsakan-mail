services:
  thotsakan-mail:
    build: .
    container_name: thotsakan-mail-engine
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/thotsakan.db
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - LOG_RETENTION_DAYS=90
    volumes:
      - thotsakan_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz | grep -q healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  thotsakan_data:
    driver: local
